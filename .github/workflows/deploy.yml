name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    # Runs on the VPS itself — GitHub cloud cannot SSH inbound to this host.
    runs-on: [self-hosted, mindora]
    steps:
      - name: Pull and rebuild
        run: |
          set -euo pipefail
          cd "$HOME/mindora"
          test -f .env
          git fetch origin main
          git clean -fdx -e .env
          git checkout -B main origin/main
          git reset --hard origin/main
          docker compose up -d --build
          docker compose ps
