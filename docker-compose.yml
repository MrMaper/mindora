services:
  db:
    image: postgres:17-alpine
    container_name: mindora-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mindora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mindora}
    volumes:
      - mindora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mindora} -d ${POSTGRES_DB:-mindora}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mindora

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindora-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mindora}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mindora}?schema=public
      PORT: "3080"
      HOSTNAME: "0.0.0.0"
      DISABLE_DB_SEED: ${DISABLE_DB_SEED:-1}
    ports:
      - "3080:3080"
    networks:
      - mindora

  # Hits deadline/vocab/Bale digest cron every 5 minutes (needs CRON_SECRET).
  cron:
    image: curlimages/curl:8.12.1
    container_name: mindora-cron
    restart: unless-stopped
    depends_on:
      - app
    env_file:
      - .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$CRON_SECRET" ]; then
          echo "CRON_SECRET unset; cron sidecar idle"
          sleep infinity
        fi
        echo "Cron sidecar started (every 300s)"
        while true; do
          curl -sS -o /tmp/cron-out -w "%{http_code}" \
            -H "Authorization: Bearer $$CRON_SECRET" \
            "http://app:3080/api/cron/deadline-reminders" \
            > /tmp/cron-code || true
          code=$$(cat /tmp/cron-code 2>/dev/null || echo fail)
          echo "cron tick HTTP $$code"
          sleep 300
        done
    networks:
      - mindora

volumes:
  mindora_pgdata:

networks:
  mindora:
    driver: bridge
