services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: mindora-app

    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/${POSTGRES_DB}?schema=public"
      BALE_BOT_TOKEN: ${BALE_BOT_TOKEN}
      BALE_ADMIN_CHAT_ID: ${BALE_ADMIN_CHAT_ID}
      APP_URL: ${APP_URL}
      BALE_BASE_URL: ${BALE_BASE_URL}
      PORT: "3080"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3080:3080"
    networks:
      - default
      - nazarbin-net

networks:
  nazarbin-net:
    external: true
